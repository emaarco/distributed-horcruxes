name: Pre-Merge Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build with Gradle
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Step 2: Setup Gradle
      - name: Setup Gradle
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0

      # Step 3: Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 4: Run Gradle build
      - name: Run Gradle Build
        run: ./gradlew build

  lint-bpmn:
    name: Lint BPMN Models
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Lint BPMN models (fail on warnings)
      - name: Run bpmnlint
        run: npm run lint:bpmn

  bruno:
    name: Bruno end-to-end (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: after-transaction, env: local, tags: pattern }
          - { module: outbox-pattern, env: local, tags: pattern }
          - { module: idempotency-pattern, env: local, tags: pattern }
          - { module: combined-pattern, env: local, tags: pattern }
          - { module: saga-pattern, env: saga, tags: saga }
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Start the Camunda 8 stack
        run: docker compose -f stack/docker-compose.yml up -d
      - name: Wait for Zeebe to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9600/actuator/health > /dev/null; then
              echo "Zeebe is up"; exit 0
            fi
            sleep 5
          done
          echo "Zeebe did not start in time"; docker compose -f stack/docker-compose.yml logs --tail 200; exit 1
      - name: Start the example application
        run: ./gradlew :examples:${{ matrix.module }}:bootRun --no-daemon > app.log 2>&1 &
      - name: Wait for the application to be ready
        run: |
          PORT=$([ "${{ matrix.module }}" = "saga-pattern" ] && echo 8083 || echo 8081)
          for i in $(seq 1 90); do
            if curl -sf http://localhost:$PORT/actuator/health > /dev/null; then
              echo "Application is up"; exit 0
            fi
            sleep 3
          done
          echo "Application did not start in time"; tail -n 200 app.log; exit 1
      - name: Run Bruno scenarios
        working-directory: bruno
        run: npx --yes @usebruno/cli@4.0.0 run . --env ${{ matrix.env }} --tags ${{ matrix.tags }} -r
      - name: Dump application log on failure
        if: failure()
        run: tail -n 300 app.log
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f stack/docker-compose.yml logs --tail 300
